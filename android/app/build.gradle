plugins {
    id 'com.android.application'
}

def releaseName = file('../../VERSION').getText('UTF-8').trim()
def match = (releaseName =~ /^(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?$/)
if (!match.matches()) {
    throw new GradleException('VERSION debe usar X.Y.Z o X.Y.Z-dev.N')
}
def releaseRevision = match[0][4] ? Integer.parseInt(match[0][4]) : 99
if (releaseRevision > 98 && match[0][4]) {
    throw new GradleException('La candidata dev supera el rango 1..98')
}
def releaseCode = Integer.parseInt(match[0][1]) * 1000000 +
    Integer.parseInt(match[0][2]) * 10000 +
    Integer.parseInt(match[0][3]) * 100 + releaseRevision

def keyPath = System.getenv('TOCAYOS_ANDROID_KEYSTORE')
def keyAliasValue = System.getenv('TOCAYOS_ANDROID_ALIAS')
def storePasswordValue = System.getenv('TOCAYOS_ANDROID_STORE_PASSWORD')
def keyPasswordValue = System.getenv('TOCAYOS_ANDROID_KEY_PASSWORD')
def signingReady = [keyPath, keyAliasValue, storePasswordValue, keyPasswordValue].every { it }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && !signingReady) {
    throw new GradleException('La release Android exige keystore/alias/password externos')
}

android {
    namespace 'mx.lostocayos.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'mx.lostocayos.pos'
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName releaseName
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(keyPath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                storeType 'JKS'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
