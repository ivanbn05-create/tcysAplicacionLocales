services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tocayos}
      POSTGRES_USER: ${POSTGRES_USER:-tocayos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY es obligatoria}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS es obligatoria}
      DJANGO_DEBUG: "false"
      # Gunicorn publica todas las interfaces del contenedor; declarar la misma
      # superficie evita que el guard de HTTP LAN asuma loopback por defecto.
      WAITRESS_HOST: "0.0.0.0"
      ALLOW_INSECURE_HTTP_LAN: ${ALLOW_INSECURE_HTTP_LAN:?define true sólo si aceptas HTTP LAN sin cifrar}
    ports:
      - "8000:8000"
    volumes:
      - impresiones:/app/media/impresiones
    depends_on:
      db:
        condition: service_healthy

  impresion:
    build: .
    restart: unless-stopped
    command: python manage.py procesar_impresiones
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      PRINT_SYNC: "false"
    volumes:
      - impresiones:/app/media/impresiones
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  impresiones:
