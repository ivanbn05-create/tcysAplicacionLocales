name: Edge catálogo v3 laboratorio

on:
  push:
    branches:
      - codex/production-1.0-catalogo-promociones-dev.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Contratos y enrolamiento
        run: python -m unittest tests.test_contracts_vps tests.test_enrolamiento_edge tests.test_dev10_settings -v
      - name: Catálogo y compatibilidad Django
        run: python manage.py test ventas.test_catalogo_v3_aprovisionamiento ventas.test_dev10_integraciones --noinput
